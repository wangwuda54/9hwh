<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>9HWH 发布后台</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6fb;
      --panel: #ffffff;
      --text: #111827;
      --muted: #64748b;
      --line: #e5e7eb;
      --brand: #111827;
      --danger: #b91c1c;
      --ok: #166534;
      --shadow: 0 16px 40px rgba(15, 23, 42, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at top left, #eef2ff, transparent 34%), var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .shell { max-width: 1180px; margin: 0 auto; padding: 28px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
    .brand { display: flex; flex-direction: column; gap: 2px; }
    .brand strong { font-size: 24px; letter-spacing: -.02em; }
    .brand span { color: var(--muted); font-size: 14px; }
    .links { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    a, button { font: inherit; }
    a { color: var(--brand); font-weight: 700; text-decoration: none; }
    a:hover { text-decoration: underline; }
    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      background: var(--brand);
      color: #fff;
      cursor: pointer;
      font-weight: 700;
    }
    button.secondary { background: #e5e7eb; color: var(--text); }
    button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(320px, .8fr); gap: 20px; align-items: start; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 22px; }
    .panel h1, .panel h2 { margin: 0 0 14px; line-height: 1.2; }
    .panel h1 { font-size: 26px; }
    .panel h2 { font-size: 20px; }
    .hint { color: var(--muted); margin: 0 0 18px; }
    label { display: block; font-weight: 700; margin: 14px 0 6px; }
    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 11px 12px;
      font: inherit;
      background: #fff;
      color: var(--text);
      outline: none;
    }
    textarea { min-height: 300px; resize: vertical; }
    input:focus, textarea:focus { border-color: #94a3b8; box-shadow: 0 0 0 3px rgba(148, 163, 184, .18); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    .status { min-height: 24px; color: var(--muted); margin-top: 14px; white-space: pre-wrap; }
    .status.error { color: var(--danger); }
    .status.ok { color: var(--ok); }
    .login { max-width: 460px; margin: 12vh auto 0; }
    .hidden { display: none !important; }
    .post-list { display: grid; gap: 12px; }
    .post-card { border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: #fff; }
    .post-card h3 { margin: 0 0 6px; font-size: 17px; }
    .post-card p { margin: 0 0 10px; color: var(--muted); font-size: 14px; }
    .badges { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 10px; }
    .badge { display: inline-flex; border-radius: 999px; padding: 2px 9px; background: #f1f5f9; color: var(--muted); font-size: 12px; }
    .badge.published { background: #dcfce7; color: #166534; }
    .badge.draft { background: #fef3c7; color: #92400e; }
    .post-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .empty { color: var(--muted); border: 1px dashed var(--line); border-radius: 14px; padding: 18px; text-align: center; }
    .small { font-size: 13px; color: var(--muted); }
    @media (max-width: 860px) {
      .shell { padding: 18px; }
      .grid, .row { grid-template-columns: 1fr; }
      .topbar { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section id="loginView" class="panel login hidden">
      <h1>9HWH 发布后台</h1>
      <p class="hint">输入 Cloudflare Pages 环境变量 <strong>ADMIN_PASSWORD</strong> 配置的后台密码。</p>
      <form id="loginForm">
        <label for="password">后台密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <div class="actions">
          <button type="submit">登录</button>
        </div>
        <div id="loginStatus" class="status"></div>
      </form>
    </section>

    <section id="adminView" class="hidden">
      <div class="topbar">
        <div class="brand">
          <strong>9HWH 发布后台</strong>
          <span>保存草稿、发布文章、更新公开页面。</span>
        </div>
        <div class="links">
          <a href="/" target="_blank" rel="noreferrer">打开首页</a>
          <a href="/blog/" target="_blank" rel="noreferrer">打开发布列表</a>
          <button id="logoutBtn" class="ghost" type="button">退出登录</button>
        </div>
      </div>

      <div class="grid">
        <section class="panel">
          <h1 id="formTitle">新建发布内容</h1>
          <p class="hint">正文按纯文本处理，后台会自动转成段落，不执行 HTML。</p>
          <form id="postForm">
            <input id="postId" type="hidden">
            <div class="row">
              <div>
                <label for="slug">URL Slug</label>
                <input id="slug" placeholder="例如 overseas-promotion-guide" pattern="[a-z0-9][a-z0-9-]{1,80}" required>
                <div class="small">发布后地址：/posts/&lt;slug&gt;.html</div>
              </div>
              <div>
                <label for="tags">标签</label>
                <input id="tags" placeholder="海外推广, 广告投放, 获客">
              </div>
            </div>

            <label for="title">标题</label>
            <input id="title" maxlength="120" required>

            <label for="summary">摘要</label>
            <textarea id="summary" maxlength="220" style="min-height: 92px" required></textarea>

            <label for="content">正文</label>
            <textarea id="content" required></textarea>

            <div class="actions">
              <button id="saveBtn" class="secondary" type="button">保存草稿</button>
              <button id="publishBtn" type="button">发布 / 更新发布</button>
              <button id="resetBtn" class="ghost" type="button">清空表单</button>
            </div>
            <div id="formStatus" class="status"></div>
          </form>
        </section>

        <aside class="panel">
          <h2>内容列表</h2>
          <p class="hint">点击编辑后可继续更新，已发布内容再次发布会覆盖对应页面。</p>
          <div id="postList" class="post-list"></div>
        </aside>
      </div>
    </section>
  </main>

  <script>
    const state = { posts: [] };

    const loginView = document.getElementById('loginView');
    const adminView = document.getElementById('adminView');
    const loginForm = document.getElementById('loginForm');
    const loginStatus = document.getElementById('loginStatus');
    const formStatus = document.getElementById('formStatus');
    const postList = document.getElementById('postList');
    const postForm = document.getElementById('postForm');
    const postId = document.getElementById('postId');
    const formTitle = document.getElementById('formTitle');

    const fields = {
      slug: document.getElementById('slug'),
      title: document.getElementById('title'),
      summary: document.getElementById('summary'),
      content: document.getElementById('content'),
      tags: document.getElementById('tags'),
    };

    document.addEventListener('DOMContentLoaded', boot);
    loginForm.addEventListener('submit', onLogin);
    document.getElementById('logoutBtn').addEventListener('click', onLogout);
    document.getElementById('saveBtn').addEventListener('click', () => submitPost('save'));
    document.getElementById('publishBtn').addEventListener('click', () => submitPost('publish'));
    document.getElementById('resetBtn').addEventListener('click', resetForm);

    async function boot() {
      const session = await api('/api/admin/session', { method: 'GET' }, false);
      if (session && session.authenticated) {
        showAdmin();
        await loadPosts();
      } else {
        showLogin();
      }
    }

    async function onLogin(event) {
      event.preventDefault();
      setStatus(loginStatus, '登录中...');
      try {
        await api('/api/admin/login', {
          method: 'POST',
          body: { password: document.getElementById('password').value },
        });
        showAdmin();
        await loadPosts();
      } catch (error) {
        setStatus(loginStatus, error.message, 'error');
      }
    }

    async function onLogout() {
      await api('/api/admin/logout', { method: 'POST' }, false);
      state.posts = [];
      postList.innerHTML = '';
      showLogin();
    }

    async function loadPosts() {
      setStatus(formStatus, '正在读取内容列表...');
      try {
        const data = await api('/api/admin/posts', { method: 'GET' });
        state.posts = data.posts || [];
        renderPosts();
        setStatus(formStatus, '内容列表已更新。', 'ok');
      } catch (error) {
        setStatus(formStatus, error.message, 'error');
      }
    }

    async function submitPost(action) {
      if (!postForm.reportValidity()) return;
      setButtonsDisabled(true);
      setStatus(formStatus, action === 'publish' ? '正在发布，会写入 GitHub 并触发 Cloudflare 重新部署...' : '正在保存草稿...');
      try {
        const payload = {
          action,
          post: {
            id: postId.value,
            slug: fields.slug.value,
            title: fields.title.value,
            summary: fields.summary.value,
            content: fields.content.value,
            tags: fields.tags.value,
          },
        };
        const data = await api('/api/admin/posts', { method: 'POST', body: payload });
        await loadPosts();
        editPost(data.post);
        const suffix = data.publicUrl ? `\n公开地址：${data.publicUrl}` : '';
        setStatus(formStatus, `操作成功。Commit：${data.commitSha}${suffix}`, 'ok');
      } catch (error) {
        setStatus(formStatus, error.message, 'error');
      } finally {
        setButtonsDisabled(false);
      }
    }

    function renderPosts() {
      if (!state.posts.length) {
        postList.innerHTML = '<div class="empty">还没有内容。先在左侧新建一条。</div>';
        return;
      }

      postList.innerHTML = state.posts.map((post) => {
        const statusClass = post.status === 'published' ? 'published' : 'draft';
        const statusText = post.status === 'published' ? '已发布' : '草稿';
        const url = `/posts/${escapeHtml(post.slug)}.html`;
        return `<article class="post-card">
          <h3>${escapeHtml(post.title)}</h3>
          <p>${escapeHtml(post.summary)}</p>
          <div class="badges">
            <span class="badge ${statusClass}">${statusText}</span>
            <span class="badge">${escapeHtml(post.slug)}</span>
          </div>
          <div class="post-actions">
            <button class="secondary" type="button" data-edit="${escapeHtml(post.id)}">编辑</button>
            ${post.status === 'published' ? `<a href="${url}" target="_blank" rel="noreferrer">查看页面</a>` : ''}
          </div>
        </article>`;
      }).join('');

      postList.querySelectorAll('[data-edit]').forEach((button) => {
        button.addEventListener('click', () => {
          const post = state.posts.find((item) => item.id === button.dataset.edit);
          if (post) editPost(post);
        });
      });
    }

    function editPost(post) {
      postId.value = post.id || '';
      fields.slug.value = post.slug || '';
      fields.title.value = post.title || '';
      fields.summary.value = post.summary || '';
      fields.content.value = post.content || '';
      fields.tags.value = Array.isArray(post.tags) ? post.tags.join(', ') : '';
      formTitle.textContent = `编辑：${post.title || post.slug}`;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      postForm.reset();
      postId.value = '';
      formTitle.textContent = '新建发布内容';
      setStatus(formStatus, '');
    }

    function showLogin() {
      loginView.classList.remove('hidden');
      adminView.classList.add('hidden');
      loginForm.reset();
    }

    function showAdmin() {
      loginView.classList.add('hidden');
      adminView.classList.remove('hidden');
    }

    async function api(url, options = {}, strict = true) {
      const response = await fetch(url, {
        method: options.method || 'GET',
        headers: options.body ? { 'Content-Type': 'application/json' } : undefined,
        body: options.body ? JSON.stringify(options.body) : undefined,
        credentials: 'same-origin',
      });

      const text = await response.text();
      const data = text ? JSON.parse(text) : {};

      if (!response.ok) {
        const error = new Error(data.message || `请求失败：HTTP ${response.status}`);
        error.data = data;
        if (strict) throw error;
        return null;
      }

      return data;
    }

    function setStatus(element, message, type = '') {
      element.textContent = message || '';
      element.className = `status ${type}`.trim();
    }

    function setButtonsDisabled(disabled) {
      document.getElementById('saveBtn').disabled = disabled;
      document.getElementById('publishBtn').disabled = disabled;
      document.getElementById('resetBtn').disabled = disabled;
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
  </script>
</body>
</html>
