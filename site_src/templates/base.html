<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <meta name="description" content="{{ description }}">
  {{ robots_meta }}
  <link rel="canonical" href="{{ canonical }}">
  <link rel="stylesheet" href="/assets/css/styles.css?v={{ asset_version }}">
  {{ json_ld }}
</head>
<body>
  <header class="site-header">
    <div class="container nav-shell">
      <a class="brand" href="/" aria-label="{{ site_name }} 首页">
        <span class="brand-mark">9</span>
        <span class="brand-text">{{ site_name }}</span>
      </a>
      <nav class="site-nav" aria-label="主导航">{{ nav }}</nav>
    </div>
  </header>
{{ breadcrumb }}
  <main>{{ content }}</main>
  {{ floating_contact }}
  <footer class="site-footer">{{ footer }}</footer>
</body>
</html>
