<section class="page-hero">
  <div class="container">
    <p class="eyebrow">{{ eyebrow }}</p>
    <h1>{{ h1 }}</h1>
    <p class="lead">{{ description }}</p>
  </div>
</section>

<section class="section">
  <div class="container stack video-page-stack">
    <div class="video-player-wrap">
      <video class="video-player" controls preload="metadata" poster="{{ thumbnail }}">
        <source src="{{ video_file }}" type="video/mp4">
      </video>
    </div>
    <div class="grid grid-2">
      <article class="card video-copy-card">
        <h2>视频说明</h2>
        <p>{{ summary }}</p>
        <p class="small">页面关键词：{{ primary_keyword }}</p>
        <div class="video-meta">
          <span>时长：{{ duration_seconds }} 秒</span>
        </div>
        <div class="video-tags">{{ tags }}</div>
      </article>

      <article class="card video-copy-card">
        <h2>推广要点</h2>
        {{ promotion_points }}
      </article>
    </div>

    <article class="contact-panel video-contact-panel">
      <div>
        <h2>需要这类视频或落地页？</h2>
        <p>{{ contact_note }}</p>
      </div>
      <a class="button button-telegram" href="{{ telegram_url }}" target="_blank" rel="noopener noreferrer">Telegram 咨询</a>
    </article>

    <article class="card related-links">
      <h2>相关链接</h2>
      <div class="pill-list">{{ related_links }}</div>
    </article>
  </div>
</section>
