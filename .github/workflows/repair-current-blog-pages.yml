name: Repair current blog pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-current-blog-pages.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-current-blog-pages
  cancel-in-progress: false

jobs:
  rebuild-current-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild all current published pages
        run: python scripts/build_site.py

      - name: Verify sitemap URLs have local HTML files
        run: python scripts/check_static_site.py

      - name: Commit repaired static pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/public docs/site-url-inventory.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "repair current sitemap blog 404 pages"
          git push origin main
