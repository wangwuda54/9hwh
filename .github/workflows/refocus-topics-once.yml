name: Refocus 9HWH topics once

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/refocus-topics-once.yml

permissions:
  contents: write

jobs:
  refocus-topics:
    if: ${{ !contains(github.event.head_commit.message, 'Apply refocused topic copy') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refocus topic copy
        run: python scripts/refocus_topics_copy.py

      - name: Regenerate task packs
        run: python scripts/generate_deepseek_tasks.py

      - name: Build site
        run: python scripts/build_site.py

      - name: Check static site
        run: python scripts/check_static_site.py

      - name: Check sitemap readiness
        run: python scripts/check_sitemap_readiness.py

      - name: Commit generated changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add site_src/data/topics.json site/public data/content-assets data/deepseek-tasks docs || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Apply refocused topic copy"
          git push origin main
