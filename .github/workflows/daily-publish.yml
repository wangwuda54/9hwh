name: Daily 9HWH publish

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Publishing pace"
        required: true
        default: "normal"
        type: choice
        options:
          - conservative
          - normal
          - growth
          - aggressive
      limit:
        description: "Optional daily publish limit"
        required: false
        default: "3"
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: write

jobs:
  daily-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dry run daily publish
        shell: bash
        run: |
          set -euo pipefail
          mode="${{ github.event.inputs.mode || 'normal' }}"
          limit="${{ github.event.inputs.limit || '3' }}"
          python scripts/daily_publish.py --dry-run --mode "$mode" --limit "$limit"

      - name: Publish reviewed content
        shell: bash
        run: |
          set -euo pipefail
          mode="${{ github.event.inputs.mode || 'normal' }}"
          limit="${{ github.event.inputs.limit || '3' }}"
          python scripts/daily_publish.py --mode "$mode" --limit "$limit"

      - name: Build site
        run: python scripts/build_site.py

      - name: Check static site
        run: python scripts/check_static_site.py

      - name: Check sitemap readiness
        run: python scripts/check_sitemap_readiness.py

      - name: Git status
        run: git status --short

      - name: Commit and push published content
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site_src/data/content site_src/content_drafts site/public data/content-assets docs
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "daily publish reviewed content"
          git push origin main
