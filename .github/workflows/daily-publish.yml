name: Daily 9HWH publish

# Daily schedule disabled.
# Primary publishing flow is local manual publishing:
# E:/python/python.exe e:/sites/9hwh/9hwh一键发布.py
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Publishing pace"
        required: true
        default: "normal"
        type: choice
        options:
          - conservative
          - normal
          - growth
          - aggressive
      limit:
        description: "Optional daily publish limit"
        required: false
        default: "7"

permissions:
  contents: write

env:
  WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
  WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
  GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  daily-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Print context
        shell: bash
        run: |
          set -euo pipefail
          date -u
          git rev-parse HEAD
          git status --short
          python --version

      - name: Repair placeholder descriptions
        shell: bash
        run: |
          set -euo pipefail
          python scripts/repair_placeholder_descriptions.py --write --fail-on-remaining

      - name: Dry run daily publish
        shell: bash
        run: |
          set -euo pipefail
          mode="${{ github.event.inputs.mode || 'normal' }}"
          limit="${{ github.event.inputs.limit || '7' }}"
          python scripts/daily_publish.py --dry-run --mode "$mode" --limit "$limit"

      - name: Publish reviewed content
        shell: bash
        run: |
          set -euo pipefail
          mode="${{ github.event.inputs.mode || 'normal' }}"
          limit="${{ github.event.inputs.limit || '7' }}"
          python scripts/daily_publish.py --mode "$mode" --limit "$limit"

      - name: After publish status
        shell: bash
        run: |
          set -euo pipefail
          cat data/content-assets/daily_publish_report.json
          cat site_src/data/content/content_status.json
          git status --short

      - name: Validate publish report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          report_path = Path("data/content-assets/daily_publish_report.json")
          if not report_path.exists():
              print(f"[FAIL] publish report not found: {report_path}")
              sys.exit(1)

          report = json.loads(report_path.read_text(encoding="utf-8-sig"))
          status = report.get("status")
          dry_run = report.get("dry_run")
          reviewed_candidate_count = int(report.get("reviewed_candidate_count") or 0)
          selected_count = int(report.get("selected_count") or 0)
          published_count = int(report.get("published_count") or 0)
          published_items = report.get("published_items") or []

          errors = []
          if dry_run is not False:
              errors.append("daily_publish_report.json must be a formal publish report with dry_run=false")
          if status not in {"success", "no_changes"}:
              errors.append(f"unexpected publish status: {status!r}")
          if reviewed_candidate_count > 0 and selected_count > 0 and published_count <= 0:
              errors.append("reviewed candidates were selected but published_count is 0")
          if status == "success" and not published_items:
              errors.append("status is success but published_items is empty")

          print(f"total_published={report.get('total_published')}")
          print(f"published_count={published_count}")
          print("published_items=")
          for item in published_items:
              print(f"- {item.get('content_id')} {item.get('full_url') or item.get('target_url')}")

          if errors:
              for error in errors:
                  print(f"[FAIL] {error}")
              sys.exit(1)
          PY

      - name: Build site
        run: python scripts/build_site.py

      - name: Check static site
        run: python scripts/check_static_site.py

      - name: Check sitemap readiness
        run: python scripts/check_sitemap_readiness.py

      - name: Check placeholder text
        run: python scripts/check_placeholder_text.py

      - name: Git status
        run: git status --short

      - name: Commit and push published content
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site_src/data/content site_src/content_drafts site/public data/content-assets docs
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "daily publish reviewed content for $(date -u +%F)"
          git push origin main

      - name: Notify publish result
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          publish_status="$(python -c "import json; print(json.load(open('data/content-assets/daily_publish_report.json', encoding='utf-8-sig')).get('status', 'success'))")"
          if [ "$publish_status" = "no_changes" ]; then
            python scripts/notify_wecom.py --status no_changes --site-url https://www.9hwh.com
          elif [ "$publish_status" = "failure" ]; then
            python scripts/notify_wecom.py --status failure --site-url https://www.9hwh.com
          else
            python scripts/notify_wecom.py --status success --site-url https://www.9hwh.com
          fi

      - name: Notify failure
        if: failure()
        run: python scripts/notify_wecom.py --status failure --site-url https://www.9hwh.com
