<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>9HWH 发布后台</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --panel: #ffffff;
      --line: #d9e0ea;
      --text: #172033;
      --muted: #62708a;
      --brand: #1467d8;
      --brand-dark: #0f4fa8;
      --danger: #b42318;
      --ok: #087443;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 68px;
      gap: 16px;
    }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 0; font-size: 22px; }
    h2 { font-size: 18px; }
    main.shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 20px;
      padding: 22px 0 40px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
    }
    label {
      display: block;
      margin: 14px 0 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 12px;
      color: var(--text);
      font: inherit;
      background: #fff;
    }
    textarea {
      min-height: 330px;
      resize: vertical;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 12px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }
    button, .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 14px;
      color: var(--text);
      background: #fff;
      text-decoration: none;
      cursor: pointer;
      font-weight: 700;
    }
    button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
    button.primary:hover { background: var(--brand-dark); }
    button.danger { color: var(--danger); }
    button:disabled { cursor: progress; opacity: .65; }
    .status {
      min-height: 22px;
      margin-top: 14px;
      color: var(--muted);
    }
    .status.ok { color: var(--ok); }
    .status.error { color: var(--danger); }
    .post-list {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }
    .post-item {
      width: 100%;
      display: block;
      text-align: left;
      height: auto;
      padding: 12px;
    }
    .post-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-weight: 800;
    }
    .badge {
      border-radius: 999px;
      padding: 2px 8px;
      background: #eef3fb;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .muted { color: var(--muted); }
    .links {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    @media (max-width: 900px) {
      main.shell { grid-template-columns: 1fr; }
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="shell topbar">
      <div>
        <h1>9HWH 发布后台</h1>
        <p class="muted">静态文章保存到 GitHub，Cloudflare Pages 自动构建公开页。</p>
      </div>
      <a class="button" href="/publish/" target="_blank" rel="noopener noreferrer">打开公开列表</a>
    </div>
  </header>

  <main class="shell">
    <section class="panel">
      <h2>文章编辑</h2>
      <form id="editor">
        <input type="hidden" id="post-id">
        <div class="row">
          <div>
            <label for="title">标题</label>
            <input id="title" required>
          </div>
          <div>
            <label for="status">状态</label>
            <select id="status">
              <option value="draft">draft</option>
              <option value="published">published</option>
              <option value="archived">archived</option>
            </select>
          </div>
        </div>
        <label for="slug">Slug</label>
        <input id="slug" placeholder="test-post">
        <label for="summary">摘要</label>
        <input id="summary" placeholder="这是后台发布测试">
        <label for="tags">标签，英文逗号分隔</label>
        <input id="tags" placeholder="测试, 发布">
        <label for="content">正文</label>
        <textarea id="content" placeholder="支持段落、## 标题、### 小标题、- 列表"></textarea>

        <div class="actions">
          <button class="primary" type="button" data-action="publish">发布/更新发布</button>
          <button type="button" data-action="draft">保存草稿</button>
          <button class="danger" type="button" data-action="archive">下架</button>
          <button type="button" id="new-post">新建文章</button>
          <a class="button" id="public-link" href="/publish/" target="_blank" rel="noopener noreferrer">打开公开链接</a>
        </div>
        <div id="status-line" class="status"></div>
      </form>
    </section>

    <aside class="panel">
      <h2>内容列表</h2>
      <button type="button" id="refresh">刷新列表</button>
      <div id="post-list" class="post-list"></div>
    </aside>
  </main>

  <script>
    const api = "/api/admin/posts";
    const state = { posts: [], current: null };
    const fields = {
      id: document.querySelector("#post-id"),
      title: document.querySelector("#title"),
      slug: document.querySelector("#slug"),
      summary: document.querySelector("#summary"),
      tags: document.querySelector("#tags"),
      content: document.querySelector("#content"),
      status: document.querySelector("#status"),
      line: document.querySelector("#status-line"),
      list: document.querySelector("#post-list"),
      publicLink: document.querySelector("#public-link"),
    };

    function setStatus(message, type = "") {
      fields.line.textContent = message;
      fields.line.className = `status ${type}`;
    }

    function slugify(value) {
      return String(value || "")
        .trim()
        .toLowerCase()
        .replace(/['"]/g, "")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "")
        .slice(0, 80);
    }

    function currentPublicUrl() {
      const slug = slugify(fields.slug.value || fields.title.value);
      return slug ? `/publish/${slug}/` : "/publish/";
    }

    function updatePublicLink() {
      fields.publicLink.href = currentPublicUrl();
    }

    function clearEditor() {
      state.current = null;
      fields.id.value = "";
      fields.title.value = "";
      fields.slug.value = "";
      fields.summary.value = "";
      fields.tags.value = "";
      fields.content.value = "";
      fields.status.value = "draft";
      updatePublicLink();
      setStatus("");
      fields.title.focus();
    }

    function loadPost(post) {
      state.current = post;
      fields.id.value = post.id || "";
      fields.title.value = post.title || "";
      fields.slug.value = post.slug || "";
      fields.summary.value = post.summary || "";
      fields.tags.value = Array.isArray(post.tags) ? post.tags.join(", ") : "";
      fields.content.value = post.content || "";
      fields.status.value = post.status || "draft";
      updatePublicLink();
      setStatus(`已载入：${post.title}`);
    }

    function renderList() {
      fields.list.innerHTML = "";
      if (!state.posts.length) {
        fields.list.innerHTML = '<p class="muted">暂无文章。</p>';
        return;
      }
      for (const post of state.posts) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "post-item";
        button.innerHTML = `
          <span class="post-title"><span>${post.title || "(未命名)"}</span><span class="badge">${post.status || "draft"}</span></span>
          <span class="muted">/publish/${post.slug || ""}/</span>
        `;
        button.addEventListener("click", () => loadPost(post));
        fields.list.appendChild(button);
      }
    }

    async function refresh() {
      setStatus("正在读取内容列表...");
      const response = await fetch(api, { headers: { accept: "application/json" } });
      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.error || "读取失败");
      }
      state.posts = data.posts || [];
      renderList();
      setStatus("内容列表已更新。", "ok");
    }

    function payload(action) {
      return {
        action,
        id: fields.id.value || undefined,
        title: fields.title.value,
        slug: fields.slug.value || slugify(fields.title.value),
        summary: fields.summary.value,
        content: fields.content.value,
        tags: fields.tags.value,
        status: fields.status.value,
      };
    }

    async function save(action) {
      setStatus("正在保存到 GitHub...");
      document.querySelectorAll("button").forEach((button) => { button.disabled = true; });
      try {
        const response = await fetch(api, {
          method: "POST",
          headers: { "content-type": "application/json", accept: "application/json" },
          body: JSON.stringify(payload(action)),
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "保存失败");
        }
        const successMessage = data.message || `已保存到 GitHub。等待 Cloudflare 自动部署完成后，访问 ${currentPublicUrl()}。`;
        if (data.post) {
          loadPost(data.post);
        }
        await refresh();
        setStatus(successMessage, "ok");
      } catch (error) {
        setStatus(error.message, "error");
      } finally {
        document.querySelectorAll("button").forEach((button) => { button.disabled = false; });
      }
    }

    document.querySelectorAll("[data-action]").forEach((button) => {
      button.addEventListener("click", () => save(button.dataset.action));
    });
    document.querySelector("#new-post").addEventListener("click", clearEditor);
    document.querySelector("#refresh").addEventListener("click", () => refresh().catch((error) => setStatus(error.message, "error")));
    fields.title.addEventListener("input", () => {
      if (!fields.slug.value) fields.slug.value = slugify(fields.title.value);
      updatePublicLink();
    });
    fields.slug.addEventListener("input", updatePublicLink);

    refresh().catch((error) => setStatus(error.message, "error"));
  </script>
</body>
</html>
