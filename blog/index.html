<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>发布内容 - 9HWH</title>
  <meta name="description" content="9HWH 发布内容列表。">
  <style>
    :root { color-scheme: light; --bg:#f7f8fb; --card:#ffffff; --text:#121826; --muted:#5b6475; --line:#e6e8ef; --brand:#111827; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Arial, 'Microsoft YaHei', sans-serif; background:var(--bg); color:var(--text); line-height:1.7; }
    header, main, footer { max-width: 980px; margin: 0 auto; padding: 24px; }
    nav { display:flex; justify-content:space-between; gap:16px; align-items:center; }
    nav a { color:var(--brand); text-decoration:none; font-weight:700; }
    h1 { font-size: clamp(32px, 5vw, 52px); line-height:1.1; margin: 36px 0 12px; }
    .lead, footer, .empty { color:var(--muted); }
    .empty { background:var(--card); border:1px dashed var(--line); border-radius:16px; padding:22px; text-align:center; }
  </style>
</head>
<body>
  <header>
    <nav><a href="/">9HWH</a><a href="/admin/">发布后台</a></nav>
  </header>
  <main>
    <h1>发布内容</h1>
    <p class="lead">这里展示通过发布后台发布的内容。</p>
    <p class="empty">暂无已发布内容。</p>
  </main>
  <footer>© 2026 9HWH</footer>
</body>
</html>
